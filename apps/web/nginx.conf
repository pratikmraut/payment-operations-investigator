server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/uat/ {
    proxy_pass http://api:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # UAT provider 900s, Java 930s: leave time for Java's structured error.
    proxy_read_timeout 960s;
  }
  location /api/ {
    proxy_pass http://api:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Java stops waiting for the worker at 390s; allow time for its error response.
    # The worker uses two generation stages with a 180s provider read timeout each.
    proxy_read_timeout 420s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
