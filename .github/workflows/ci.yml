name: Payment investigator CI

# This directory is intended to be the repository root in the portfolio checkout.
# Action release commits were verified against their official GitHub release pages
# on 2026-09-12. All actions use full commit SHAs; this workflow never publishes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CI: "true"

jobs:
  deterministic-data:
    name: Deterministic synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Verify committed fixtures, guidance, labels, and manifest
        run: python tools/generate_data.py --check

  java:
    name: Java 17 business API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20.1+1"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Record Java and Maven versions
        run: |
          java -version
          mvn --version
      - name: Compile and test authentication, exact amounts, persistence, and review
        working-directory: services/api
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Preserve Java test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-test-reports
          path: services/api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Python 3.12 worker and pgvector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_DB: poi
          POSTGRES_USER: poi
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poi -d poi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: services/investigator/requirements.txt
      - name: Install the pinned worker and test dependencies
        run: python -m pip install --requirement services/investigator/requirements.txt
      - name: Bootstrap pgvector with the CI admin and create the restricted worker role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POI_VECTOR_DB_PASSWORD: ci-vector-only
        run: |
          docker exec --interactive "$POSTGRES_CONTAINER" \
            psql -X --username poi --dbname poi --set=ON_ERROR_STOP=1 \
            < infra/postgres/init.sql
          docker exec --interactive --env POI_VECTOR_DB_PASSWORD "$POSTGRES_CONTAINER" \
            bash -s < infra/postgres/020-vector-role.sh
      - name: Verify the worker connection has the restricted role and schema
        env:
          POI_TEST_VECTOR_DB_URL: postgresql://poi_vectors:ci-vector-only@127.0.0.1:5432/poi
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["POI_TEST_VECTOR_DB_URL"]) as connection:
              identity = connection.execute("SELECT current_user, current_schema()").fetchone()
              assert identity == ("poi_vectors", "poi_knowledge"), identity
              flags = connection.execute(
                  "SELECT rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolbypassrls "
                  "FROM pg_roles WHERE rolname = current_user"
              ).fetchone()
              assert flags is not None and not any(flags), flags
              assert not connection.execute(
                  "SELECT has_schema_privilege(current_user, 'public', 'CREATE')"
              ).fetchone()[0]
              assert connection.execute(
                  "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')"
              ).fetchone()[0]
          print("PASS restricted poi_vectors login, poi_knowledge search path, and preinstalled pgvector")
          PY
      - name: Prepare isolated workspace test directories
        run: mkdir -p runtime/ci/tmp runtime/ci/test-results
      - name: Test evidence, graph checkpoints, retrieval, and real pgvector filtering
        env:
          PYTHONPATH: ${{ github.workspace }}/services/investigator
          TMPDIR: ${{ github.workspace }}/runtime/ci/tmp
          TEMP: ${{ github.workspace }}/runtime/ci/tmp
          TMP: ${{ github.workspace }}/runtime/ci/tmp
          POI_TEST_VECTOR_DB_URL: postgresql://poi_vectors:ci-vector-only@127.0.0.1:5432/poi
          POI_RETRIEVAL_MODE: lexical
        run: >-
          python -m pytest services/investigator/tests
          --basetemp "$GITHUB_WORKSPACE/runtime/ci/pytest"
          --junitxml "$GITHUB_WORKSPACE/runtime/ci/test-results/python.xml"
      - name: Preserve Python test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-reports
          path: runtime/ci/test-results/
          if-no-files-found: ignore
          retention-days: 7

  react:
    name: React tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exactly the committed dependency lock
        run: npm ci
      - name: Test auth, review retries, errors, pending state, and keyboard dialogs
        run: npm test
      - name: Type-check and build the production application
        run: npm run build
      - name: Preserve the build as a CI artifact, without deploying
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-production-build
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  compose-acceptance:
    name: Fresh Compose lexical HTTP acceptance
    needs: [deterministic-data, java, python, react]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: poi-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POI_DB_PASSWORD: ci-compose-db-only
      POI_VECTOR_DB_PASSWORD: ci-compose-vector-only
      POI_SERVICE_KEY: ci-compose-service-only
      POI_DEMO_PASSWORD: demo-pass-local
      POI_RETRIEVAL_MODE: lexical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Validate data and Compose configuration
        run: |
          mkdir -p runtime/ci
          python tools/generate_data.py --check
          docker compose version
          docker compose config --quiet
      - name: Build and start fresh PostgreSQL, worker, API, and nginx
        # The ai profile stays disabled; replay/lexical CI downloads no model.
        run: docker compose up --build --detach --wait --wait-timeout 180 postgres investigator api web
      - name: Wait for HTTP readiness and verify the static frontend
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          endpoints = (
              "http://127.0.0.1:8091/health",
              "http://127.0.0.1:5178/api/health",
          )
          deadline = time.monotonic() + 180
          for endpoint in endpoints:
              while True:
                  try:
                      with urllib.request.urlopen(endpoint, timeout=5) as response:
                          assert json.load(response)["status"] == "UP"
                      print("READY", endpoint, flush=True)
                      break
                  except (OSError, AssertionError, ValueError) as error:
                      if time.monotonic() >= deadline:
                          raise SystemExit(f"Readiness failed for {endpoint}: {error}")
                      time.sleep(2)
          with urllib.request.urlopen("http://127.0.0.1:5178/", timeout=5) as response:
              html = response.read().decode()
              assert '<div id="root"></div>' in html
              assert '/assets/' in html
          print("PASS nginx serves the built React entry point", flush=True)
          PY
      - name: Exercise authenticated review through the nginx proxy
        run: python tools/acceptance.py --base-url http://127.0.0.1:5178 --mode replay
      - name: Verify the reported execution mode and acceptance result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("docs/validation/acceptance-replay.json").read_text())
          assert report["status"] == "passed"
          assert report["mode"] == "replay"
          assert report["modelMetrics"]["modelCalls"] == 0
          print(f"PASS {len(report['checks'])} recorded HTTP acceptance checks; no model inference")
          PY
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p runtime/ci
          docker compose ps --all > runtime/ci/compose-status.txt
          docker compose logs --no-color --timestamps > runtime/ci/compose.log 2>&1
      - name: Preserve acceptance evidence and container logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-lexical-acceptance
          path: |
            docs/validation/acceptance-replay.json
            runtime/ci/compose-status.txt
            runtime/ci/compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this CI run's containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
